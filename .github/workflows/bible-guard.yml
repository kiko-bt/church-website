# Bible integrity gate.
#
# The Bible book display names and canonical order are approved by the content
# owner and are FIXED (see README "Book names & order are immutable" and
# .claude/bible-module.md §3.1). This workflow makes that guarantee hold on the
# shared branches: it fails any pull request or push that would change a book
# name or the order, so such a change can never be merged into `main`.
#
# What it runs:
#   - npm run bible:validate  → fails if any book file name differs from the
#     locked registry (src/features/bible/bible.display-names.ts) or the dataset
#     is otherwise invalid.
#   - npm test                → the unit tests, including bible.display-names.test.ts
#     which locks names, order, and the on-disk files.

name: Bible integrity guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bible-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Bible dataset (locked names + order)
        run: npm run bible:validate

      - name: Run unit tests (name/order locks)
        run: npm test
