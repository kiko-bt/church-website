# Bible integrity gate.
#
# The book order is fixed and the display names are the content owner's to
# change, not a developer's (.claude/bible-module.md §2). This workflow makes
# that hold on the shared branches: neither can reach `main` without failing the
# check, unless the change is an explicit, reviewed edit to BIBLE_CANON or
# bible.display-names.ts.
#
# It also catches a dataset edit that would break the site — a missing verse, a
# broken number, malformed JSON — before it can be merged.

name: Bible integrity guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bible-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Bible dataset
        run: npm run bible:validate

      - name: Run unit tests (name/order locks)
        run: npm test
